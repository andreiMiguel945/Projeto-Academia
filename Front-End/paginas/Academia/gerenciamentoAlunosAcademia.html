<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/gerenciamentoAcademia.css">
    <link rel="icon" type="image/png" href="../../imagens/logosimplificado.png">
    <title>Academia - Alunos</title>
</head>
<body>
    <main class="layout">
        <header class="header">
            ALUNOS - ACADEMIA
        </header>
        
        <aside class="aside">
            <a href="../inicio.html">ínicio</a><br>
            <a href="gerenciamentoAlunosAcademia.html" style="color: #9b0c0c;">Alunos</a><br>
            <a href="gerenciamentoProfessoresAcademia.html">Professores</a><br>
            <a href="gerenciamentoTurmasAcademia.html">Turmas</a><br>
            <a href="../login.html">sair</a>
        </aside>

        <footer class="footer">
            <p>© 2026 Fitness & Fighting Londrina. Todos os direitos reservados.</p>
        </footer>

    </main>
    <script>
        async function carregarAlunos() {
            const resposta = await fetch("http://localhost:3000/alunos");
            const alunos = await resposta.json();
            const tabela = document.createElement("table");
            tabela.innerHTML = `
                <thead><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Status</th></tr></thead>
                <tbody>${alunos.map(aluno => `
                    <tr>
                        <td>${aluno.id ?? ""}</td>
                        <td>${aluno.nome ?? ""}</td>
                        <td>${aluno.email ?? ""}</td>
                        <td>${aluno.status ?? ""}</td>
                    </tr>`).join("")}</tbody>`;
            document.querySelector(".layout").insertBefore(tabela, document.querySelector(".footer"));
        }

        carregarAlunos().catch(() => {
            const mensagem = document.createElement("p");
            mensagem.textContent = "Não foi possível carregar os alunos.";
            document.querySelector(".layout").insertBefore(mensagem, document.querySelector(".footer"));
        });
    </script>
</body>
</html>
